name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1', 'pre']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # The end to end tests drive a real juliaup client. They are the only checks
  # that prove a published database is actually installable, so juliaup has to
  # be installed explicitly: julia-actions/setup-julia installs Julia directly,
  # and without juliaup on PATH these tests skip themselves and the job goes
  # green having verified nothing.
  e2e:
    name: End to end against juliaup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1

      - name: Install juliaup
        run: |
          curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel release
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"

      - name: Confirm juliaup is present
        run: |
          juliaup --version
          test -n "$(command -v juliaup)"

      - name: Run the end to end test
        env:
          # Turns an unmet prerequisite into a failure, so the job cannot go
          # green having skipped everything.
          JULIAUP_E2E_REQUIRED: 'true'
        run: julia --project=. test/e2e_tests.jl

      # Nothing mocked: republishes the real release entry from the public
      # database and installs the actual Julia from julialang.org. It downloads
      # a full Julia, so it is kept out of the matrix and run once.
      - name: Install a real Julia through a republished database
        run: julia --project=. examples/real_julia_demo.jl

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl
